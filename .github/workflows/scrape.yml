name: Scrape and Deployon:schedule:# 毎日 0, 4, 8, 12, 16, 20 時 (JST) に自動実行 (UTC時間で指定)- cron: '0 15,19,23,3,7,11 * * *'workflow_dispatch:jobs:scrape-and-deploy:runs-on: ubuntu-latestpermissions:contents: writesteps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '20'

  - name: Install Dependencies
    run: |
      npm install
      npx playwright install chromium

  - name: Run Scraper
    run: npm run scrape

  - name: Commit and Push changes
    run: |
      git config --local user.email "github-actions[bot]@users.noreply.github.com"
      git config --local user.name "github-actions[bot]"
      git add docs/data.json
      git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto update data.json" && git push)
